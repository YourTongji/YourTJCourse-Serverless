name: Sync Onesystem (Login) To VPS SQLite

on:
  workflow_dispatch:
    inputs:
      calendarId:
        description: "一系统学期ID (例如 121；本 Login 流程替代旧 Cookie 同步)"
        required: true
        type: string
      depth:
        description: "同步深度 (从 calendarId 往前同步多少学期，默认 1)"
        required: false
        default: "1"
        type: string
  # server 分支允许通过 push 触发（提交信息包含 [pk-sync] 且带 calendarId/depth）
  push:
    branches: ["server"]

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[pk-sync]'))

    env:
      PYTHONIOENCODING: utf-8
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # 同步写入 VPS 后只通过公网地址做只读 post-check，不依赖后端接口完成同步
      BACKEND_URL: ${{ secrets.BACKEND_URL || secrets.VITE_API_URL }}
      ONESYSTEM_SNO: ${{ secrets.ONESYSTEM_SNO }}
      ONESYSTEM_PASSWORD: ${{ secrets.ONESYSTEM_PASSWORD }}
      ONESYSTEM_IMAP_SERVER: ${{ secrets.ONESYSTEM_IMAP_SERVER }}
      ONESYSTEM_IMAP_PORT: ${{ secrets.ONESYSTEM_IMAP_PORT }}
      ONESYSTEM_IMAP_EMAIL: ${{ secrets.ONESYSTEM_IMAP_EMAIL }}
      ONESYSTEM_IMAP_GRANTCODE: ${{ secrets.ONESYSTEM_IMAP_GRANTCODE }}
      D1_PRIMARY_DATABASE_NAME: jcourse-db

    steps:
      - name: Resolve calendarId/depth
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_CALENDAR_ID: ${{ inputs.calendarId }}
          INPUT_DEPTH: ${{ inputs.depth }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        shell: bash
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            depth="${INPUT_DEPTH:-1}"
            if ! [[ "$INPUT_CALENDAR_ID" =~ ^[0-9]+$ ]]; then
              echo "calendarId must be numeric" >&2
              exit 1
            fi
            if ! [[ "$depth" =~ ^[0-9]+$ ]]; then
              echo "depth must be numeric" >&2
              exit 1
            fi
            echo "calendarId=$INPUT_CALENDAR_ID" >> "$GITHUB_OUTPUT"
            echo "depth=$depth" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          calendarId="$(printf '%s' "$COMMIT_MSG" | sed -nE 's/.*calendarId=([0-9]+).*/\1/p' | head -n1)"
          depth="$(printf '%s' "$COMMIT_MSG" | sed -nE 's/.*depth=([0-9]+).*/\1/p' | head -n1)"

          if [ -z "$calendarId" ]; then
            echo "Missing calendarId in commit message. Example: [pk-sync] calendarId=121 depth=3" >&2
            exit 1
          fi
          if [ -z "$depth" ]; then depth="1"; fi

          echo "calendarId=$calendarId" >> "$GITHUB_OUTPUT"
          echo "depth=$depth" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate secrets
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${{ secrets.VPS_HOST }}" ]; then echo "Missing secrets.VPS_HOST" >&2; exit 1; fi
          if [ -z "${{ secrets.VPS_PORT }}" ]; then echo "Missing secrets.VPS_PORT" >&2; exit 1; fi
          if [ -z "${{ secrets.VPS_USER }}" ]; then echo "Missing secrets.VPS_USER" >&2; exit 1; fi
          if [ -z "${{ secrets.VPS_SSH_KEY }}" ]; then echo "Missing secrets.VPS_SSH_KEY" >&2; exit 1; fi
          if [ -z "${ONESYSTEM_SNO:-}" ]; then echo "Missing secrets.ONESYSTEM_SNO" >&2; exit 1; fi
          if [ -z "${ONESYSTEM_PASSWORD:-}" ]; then echo "Missing secrets.ONESYSTEM_PASSWORD" >&2; exit 1; fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install backend deps (wrangler)
        working-directory: backend
        run: npm ci

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests pycryptodome beautifulsoup4

      - name: Write onesystem config (runtime)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p backend
          printf "%s\n" "[Account]" > backend/config.onesystem.ini
          printf "sno=%s\n" "$ONESYSTEM_SNO" >> backend/config.onesystem.ini
          printf "passwd=%s\n" "$ONESYSTEM_PASSWORD" >> backend/config.onesystem.ini
          # Optional IMAP section (only needed if your account triggers extra verification / email code)
          if [ -n "${ONESYSTEM_IMAP_SERVER:-}" ] && [ -n "${ONESYSTEM_IMAP_PORT:-}" ] && [ -n "${ONESYSTEM_IMAP_EMAIL:-}" ] && [ -n "${ONESYSTEM_IMAP_GRANTCODE:-}" ]; then
            printf "\n%s\n" "[IMAP]" >> backend/config.onesystem.ini
            printf "server_domain=%s\n" "$ONESYSTEM_IMAP_SERVER" >> backend/config.onesystem.ini
            printf "server_port=%s\n" "$ONESYSTEM_IMAP_PORT" >> backend/config.onesystem.ini
            printf "qq_emailaddr=%s\n" "$ONESYSTEM_IMAP_EMAIL" >> backend/config.onesystem.ini
            printf "qq_grantcode=%s\n" "$ONESYSTEM_IMAP_GRANTCODE" >> backend/config.onesystem.ini
          fi

      - name: Login & export SQL
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          python -u ./scripts/pk-login-and-export-sql.py \
            --calendarId "${{ steps.resolve.outputs.calendarId }}" \
            --depth "${{ steps.resolve.outputs.depth }}" \
            --out-dir ".tmp/pk-sync" \
            --config "./config.onesystem.ini" \
            2>&1 | tee pk-sync-summary.log

      - name: Upload PK SQL to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "backend/.tmp/pk-sync/"
          target: /opt/yourtjcourse/incoming/pk-sync-${{ steps.resolve.outputs.calendarId }}-${{ github.run_id }}/

      - name: Apply PK SQL to VPS SQLite & rebuild search index
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            GEN="pk-${{ steps.resolve.outputs.calendarId }}-${{ github.run_id }}"
            if ! [[ "$GEN" =~ ^[A-Za-z0-9._-]+$ ]]; then
              echo "Invalid generation: $GEN" >&2
              exit 1
            fi

            SQL_PARENT="/opt/yourtjcourse/incoming/pk-sync-${{ steps.resolve.outputs.calendarId }}-${{ github.run_id }}"
            SQL_DIR="$SQL_PARENT/backend/.tmp/pk-sync"
            DB="/opt/yourtjcourse/data/jcourse.db"
            LOCK_FILE="/opt/yourtjcourse/data/yourtjcourse-maintenance.lock"
            exec 9>"$LOCK_FILE"
            flock -x 9
            echo "[sync] full maintenance lock acquired"
            ls -la "$SQL_DIR"

            # Move the online manager to FTS fallback before the database changes.
            sqlite3 "$DB" \
              "INSERT OR REPLACE INTO settings (key, value) VALUES ('course_search_required_generation', '$GEN');"
            docker compose -f /opt/yourtjcourse/docker-compose.yml kill -s HUP backend || true

            LOCK_ALREADY_HELD=1 LOCK_FILE="$LOCK_FILE" bash /opt/yourtjcourse/repo/YourTJCourse-Serverless/backend/scripts/apply-pk-sync-to-sqlite.sh \
              /opt/yourtjcourse/data/jcourse.db \
              "$SQL_DIR"

            docker compose -f /opt/yourtjcourse/docker-compose.yml --profile tools run --rm --build \
              -e MAINTENANCE_LOCK_ALREADY_HELD=1 maintenance \
              post-sync --generation "$GEN" --index-root /data/search-index --lock-file /data/yourtjcourse-maintenance.lock

            docker compose -f /opt/yourtjcourse/docker-compose.yml kill -s HUP backend || true
            for i in $(seq 1 30); do
              body="$(curl -fsS http://127.0.0.1:8787/readyz || true)"
              if printf '%s' "$body" | grep -F "\"generation\":\"$GEN\"" >/dev/null \
                && printf '%s' "$body" | grep -F '"usable":true' >/dev/null; then
                echo "[sync] search generation active: $GEN"
                rm -rf "$SQL_PARENT"
                exit 0
              fi
              sleep 1
            done
            echo "[sync] search generation did not become active: $GEN" >&2
            curl -sS http://127.0.0.1:8787/readyz || true
            exit 1

      - name: Post-check via backend API
        shell: bash
        run: |
          set -euo pipefail
          calendarId="${{ steps.resolve.outputs.calendarId }}"
          if [ -z "${BACKEND_URL:-}" ]; then
            echo "BACKEND_URL not set, skip api check"
            exit 0
          fi
          BACKEND_URL="${BACKEND_URL%/}"
          if [[ "$BACKEND_URL" == */api ]]; then BACKEND_URL="${BACKEND_URL%/api}"; fi
          export CALENDAR_ID="$calendarId"
          echo "Check: $BACKEND_URL/api/getAllCalendar"
          curl -fsSL "$BACKEND_URL/api/getAllCalendar" | head -c 500
          echo
          node - <<'NODE'
          const baseUrl = process.env.BACKEND_URL.replace(/\/+$/, '').replace(/\/api$/, '')
          const calendarId = Number(process.env.CALENDAR_ID)

          async function post(path, body) {
            const res = await fetch(`${baseUrl}${path}`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(body)
            })
            if (!res.ok) throw new Error(`${path} HTTP ${res.status}`)
            const json = await res.json()
            if (json.code !== 200) throw new Error(`${path} returned ${JSON.stringify(json).slice(0, 200)}`)
            return json.data
          }

          const gradeData = await post('/api/findGradeByCalendarId', { calendarId })
          const grades = Array.isArray(gradeData?.gradeList) ? gradeData.gradeList : []
          if (grades.length === 0) throw new Error('findGradeByCalendarId returned empty gradeList')

          const grade = grades[0]
          const majors = await post('/api/findMajorByGrade', { calendarId, grade })
          if (!Array.isArray(majors) || majors.length === 0) throw new Error('findMajorByGrade returned empty list')

          const major = majors.find((item) => item?.code) || majors[0]
          if (!major?.code) throw new Error('findMajorByGrade returned no usable major code')

          const courses = await post('/api/findCourseByMajor', { calendarId, grade, code: major.code })
          if (!Array.isArray(courses) || courses.length === 0) throw new Error('findCourseByMajor returned empty list')
          const coursesWithCredit = courses.filter((course) => Number(course?.credit || 0) > 0)
          if (coursesWithCredit.length === 0) throw new Error('findCourseByMajor returned only zero-credit courses')

          const optionalTypes = await post('/api/findOptionalCourseType', { calendarId })
          if (!Array.isArray(optionalTypes)) throw new Error('findOptionalCourseType returned non-list')

          const search = await post('/api/findCourseBySearch', { calendarId, courseName: courses[0].courseName || '' })
          if (!Array.isArray(search?.courses)) throw new Error('findCourseBySearch returned invalid payload')
          const searchCoursesWithCredit = search.courses.filter((course) => Number(course?.credit || 0) > 0)
          if (search.courses.length > 0 && searchCoursesWithCredit.length === 0) throw new Error('findCourseBySearch returned only zero-credit courses')

          const time = await post('/api/findCourseByTime', { calendarId, day: 1, section: 1 })
          if (!Array.isArray(time)) throw new Error('findCourseByTime returned invalid payload')

          console.log(JSON.stringify({
            calendarId,
            grade,
            majors: majors.length,
            courses: courses.length,
            coursesWithCredit: coursesWithCredit.length,
            optionalTypes: optionalTypes.length,
            searchCourses: search.courses.length,
            searchCoursesWithCredit: searchCoursesWithCredit.length,
            timeCourses: time.length
          }))
          NODE
