name: Setup Legacy Course Domain

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - name: Configure Netlify alias and Cloudflare DNS
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NETLIFY_SITE_ID: 0a9c8b3c-6a78-480d-813c-dc78d9344afc
          LEGACY_DOMAIN: jcourse.yourtj.de
          NETLIFY_HOST: jcourse-web.netlify.app
        run: |
          set -euo pipefail

          site_json="$(curl -fsS \
            -H "Authorization: Bearer ${NETLIFY_AUTH_TOKEN}" \
            "https://api.netlify.com/api/v1/sites/${NETLIFY_SITE_ID}")"

          aliases="$(printf '%s' "$site_json" | jq -c --arg domain "$LEGACY_DOMAIN" \
            '((.domain_aliases // []) + [$domain]) | unique')"

          curl -fsS -X PATCH \
            -H "Authorization: Bearer ${NETLIFY_AUTH_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data "$(jq -nc --argjson aliases "$aliases" '{domain_aliases:$aliases}')" \
            "https://api.netlify.com/api/v1/sites/${NETLIFY_SITE_ID}" >/tmp/netlify-site.json

          jq -e --arg domain "$LEGACY_DOMAIN" '(.domain_aliases // []) | index($domain) != null' /tmp/netlify-site.json >/dev/null
          echo "Netlify alias present: ${LEGACY_DOMAIN}"

          zone_id="$(curl -fsS \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            'https://api.cloudflare.com/client/v4/zones?name=yourtj.de&status=active' \
            | jq -r '.result[0].id // empty')"
          test -n "$zone_id"

          records_json="$(curl -fsS \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/zones/${zone_id}/dns_records?name=${LEGACY_DOMAIN}")"
          record_id="$(printf '%s' "$records_json" | jq -r '.result[0].id // empty')"

          payload="$(jq -nc --arg name "$LEGACY_DOMAIN" --arg content "$NETLIFY_HOST" \
            '{type:"CNAME",name:$name,content:$content,ttl:1,proxied:false}')"

          if [ -n "$record_id" ]; then
            curl -fsS -X PUT \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H 'Content-Type: application/json' \
              --data "$payload" \
              "https://api.cloudflare.com/client/v4/zones/${zone_id}/dns_records/${record_id}" >/tmp/cf.json
          else
            curl -fsS -X POST \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H 'Content-Type: application/json' \
              --data "$payload" \
              "https://api.cloudflare.com/client/v4/zones/${zone_id}/dns_records" >/tmp/cf.json
          fi

          jq -e '.success == true' /tmp/cf.json >/dev/null
          echo "Cloudflare DNS present: ${LEGACY_DOMAIN} -> ${NETLIFY_HOST} (DNS only)"
