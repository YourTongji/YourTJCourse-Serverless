name: Diagnose VPS Cap

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Cap and backend logs
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            printf '%s\n' 'CAP_DIAGNOSTIC_BEGIN'
            docker inspect -f 'cap_status={{.State.Status}} cap_restarts={{.RestartCount}}' cap
            for pattern in 'error' 'ERR_INVALID_URL' 'response.split' 'Invalid solution' 'instr_' 'blocked' 'Token not found' 'Invalid secret'; do
              count=$(docker logs --since=15m cap 2>&1 | grep -F -i -c "$pattern" || true)
              printf 'cap_recent_%s=%s\n' "$(printf '%s' "$pattern" | tr ' ' '_')" "$count"
            done
            for pattern in '[cap]' 'siteverify timeout' 'siteverify busy' 'verify failed' 'service error'; do
              count=$(docker logs --since=15m yourtjcourse-backend-1 2>&1 | grep -F -c "$pattern" || true)
              printf 'backend_recent_%s=%s\n' "$(printf '%s' "$pattern" | tr ' ' '_')" "$count"
            done
            printf '%s\n' 'CAP_DIAGNOSTIC_END'
