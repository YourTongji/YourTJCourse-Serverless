name: Deploy Backend to VPS

on:
  push:
    branches: ["server"]
    paths:
      - "backend/**"
      - "docker-compose.yml"
      - ".github/workflows/deploy-vps.yml"
  workflow_dispatch: {}

concurrency:
  group: deploy-vps
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Render backend.env from GitHub Secrets
        shell: bash
        env:
          CAPTCHA_SITEVERIFY_URL: ${{ secrets.CAPTCHA_SITEVERIFY_URL }}
          VITE_CAPTCHA_URL: ${{ secrets.VITE_CAPTCHA_URL }}
          ADMIN_SECRET: ${{ secrets.JCOURSE_ADMIN_SECRET }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          TURNSTILE_SITEVERIFY_URL: ${{ secrets.TURNSTILE_SITEVERIFY_URL }}
          CREDIT_API_BASE: ${{ secrets.CREDIT_API_BASE }}
          VITE_CREDIT_API_BASE: ${{ secrets.VITE_CREDIT_API_BASE }}
          CREDIT_JCOURSE_SECRET: ${{ secrets.CREDIT_JCOURSE_SECRET }}
          JCOURSE_INTEGRATION_SECRET: ${{ secrets.JCOURSE_INTEGRATION_SECRET }}
          AI_SUMMARY_KEY: ${{ secrets.AI_SUMMARY_KEY }}
          AI_SUMMARY_MODEL: ${{ secrets.AI_SUMMARY_MODEL }}
          AI_SUMMARY_BASE_URL: ${{ secrets.AI_SUMMARY_BASE_URL }}
          CAP_API_BASE: ${{ secrets.CAP_API_BASE }}
          CAP_API_INTERNAL_BASE: ${{ secrets.CAP_API_INTERNAL_BASE }}
          CAP_SITE_KEY: ${{ secrets.CAP_SITE_KEY }}
          CAP_SECRET_KEY: ${{ secrets.CAP_SECRET_KEY }}
          CAP_VERIFY_TIMEOUT_MS: ${{ vars.CAP_VERIFY_TIMEOUT_MS }}
          CAP_VERIFY_MAX_IN_FLIGHT: ${{ vars.CAP_VERIFY_MAX_IN_FLIGHT }}
          FEISHU_REPORT_WEBHOOK_URL: ${{ secrets.FEISHU_REPORT_WEBHOOK_URL }}
          FEISHU_REPORT_WEBHOOK_SECRET: ${{ secrets.FEISHU_REPORT_WEBHOOK_SECRET }}
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
        run: |
          set -euo pipefail
          # 允许缺省并回退到兼容 secret 名（与旧 Cloudflare 工作流行为一致）
          CAPTCHA_URL="${CAPTCHA_SITEVERIFY_URL:-${VITE_CAPTCHA_URL:-}}"
          CREDIT_BASE="${CREDIT_API_BASE:-${VITE_CREDIT_API_BASE:-}}"
          CREDIT_SECRET="${CREDIT_JCOURSE_SECRET:-${JCOURSE_INTEGRATION_SECRET:-}}"
          cat > backend.env <<EOF
          APP_ENV=production
          PORT=8787
          DATABASE_URL=file:/data/jcourse.db
          CAPTCHA_SITEVERIFY_URL=$CAPTCHA_URL
          ADMIN_SECRET=$ADMIN_SECRET
          TURNSTILE_SECRET_KEY=$TURNSTILE_SECRET_KEY
          TURNSTILE_SITEVERIFY_URL=$TURNSTILE_SITEVERIFY_URL
          CREDIT_API_BASE=$CREDIT_BASE
          VITE_CREDIT_API_BASE=$CREDIT_BASE
          CREDIT_JCOURSE_SECRET=$CREDIT_SECRET
          JCOURSE_INTEGRATION_SECRET=$CREDIT_SECRET
          AI_SUMMARY_KEY=$AI_SUMMARY_KEY
          AI_SUMMARY_MODEL=$AI_SUMMARY_MODEL
          AI_SUMMARY_BASE_URL=$AI_SUMMARY_BASE_URL
          CAP_API_BASE=$CAP_API_BASE
          CAP_API_INTERNAL_BASE=${CAP_API_INTERNAL_BASE:-http://cap:3000}
          CAP_SITE_KEY=$CAP_SITE_KEY
          CAP_SECRET_KEY=$CAP_SECRET_KEY
          CAP_VERIFY_TIMEOUT_MS=$CAP_VERIFY_TIMEOUT_MS
          CAP_VERIFY_MAX_IN_FLIGHT=$CAP_VERIFY_MAX_IN_FLIGHT
          FEISHU_REPORT_WEBHOOK_URL=$FEISHU_REPORT_WEBHOOK_URL
          FEISHU_REPORT_WEBHOOK_SECRET=$FEISHU_REPORT_WEBHOOK_SECRET
          PUBLIC_URL=${PUBLIC_URL:-https://jcourse.yourtj.de}
          MIGRATION_READONLY=${{ vars.MIGRATION_READONLY || '0' }}
          EOF
          # runner 需要可读该文件供 scp-action 打包；VPS 端脚本会再 chmod 600
          chmod 644 backend.env

      - name: Upload backend source & env to VPS staging
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "backend/,docker-compose.yml,backend.env"
          target: /opt/yourtjcourse/staging/

      - name: Build & restart backend on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            STAGING=/opt/yourtjcourse/staging
            rm -rf /opt/yourtjcourse/repo/YourTJCourse-Serverless/backend
            mv "$STAGING/backend" /opt/yourtjcourse/repo/YourTJCourse-Serverless/backend
            cp "$STAGING/docker-compose.yml" /opt/yourtjcourse/docker-compose.yml
            cp "$STAGING/backend.env" /opt/yourtjcourse/backend.env
            chmod 600 /opt/yourtjcourse/backend.env
            chmod +x /opt/yourtjcourse/repo/YourTJCourse-Serverless/backend/scripts/*.sh
            cd /opt/yourtjcourse
            docker compose up -d --build backend
            sleep 5
            curl -fsS http://127.0.0.1:8787/healthz
            printf '%s\n' 'CAP_RUNTIME_DIAGNOSTIC_BEGIN'
            docker exec yourtjcourse-backend-1 node -e 'const e=process.env; console.log(JSON.stringify({internalBase:e.CAP_API_INTERNAL_BASE === "http://cap:3000", baseConfigured:Boolean(e.CAP_API_BASE), siteKeyConfigured:Boolean(e.CAP_SITE_KEY), secretConfigured:Boolean(e.CAP_SECRET_KEY)}))'
            docker exec yourtjcourse-backend-1 node -e 'const e=process.env; const key=String(e.CAP_SITE_KEY||""); const base=String(e.CAP_API_INTERNAL_BASE||e.CAP_API_BASE||"").replace(/\\/+$/,""); const url=`${base}/${encodeURIComponent(key)}/siteverify`; const started=Date.now(); fetch(url,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({secret:e.CAP_SECRET_KEY,response:`${key}:diagnostic:invalid`})}).then(async (res)=>{await res.text(); console.log(JSON.stringify({siteverifyStatus:res.status,elapsedMs:Date.now()-started,bodyPresent:true}))}).catch((err)=>{console.log(JSON.stringify({siteverifyStatus:0,elapsedMs:Date.now()-started,error:err?.name||"error"})); process.exitCode=1})'
            for pattern in 'siteverify timeout' 'siteverify busy' 'siteverify HTTP' 'service error'; do
              count=$(docker logs --since=6h yourtjcourse-backend-1 2>&1 | grep -F -c "$pattern" || true)
              printf 'backend_log_%s=%s\n' "$(printf '%s' "$pattern" | tr ' ' '_')" "$count"
            done
            cap_invalid_url=$(docker logs --since=6h cap 2>&1 | grep -F -c 'ERR_INVALID_URL' || true)
            cap_malformed=$(docker logs --since=6h cap 2>&1 | grep -F -c 'response.split' || true)
            printf 'cap_log_invalid_url=%s\n' "$cap_invalid_url"
            printf 'cap_log_malformed_siteverify=%s\n' "$cap_malformed"
            printf '%s\n' 'CAP_RUNTIME_DIAGNOSTIC_END'
