name: Renew Legacy Course TLS

on:
  push:
    branches: ["server"]
    paths:
      - ".github/workflows/renew-legacy-domain-tls.yml"

permissions:
  contents: read

jobs:
  renew:
    runs-on: ubuntu-latest
    steps:
      - name: Renew Netlify certificate
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: 0a9c8b3c-6a78-480d-813c-dc78d9344afc
        run: |
          set -euo pipefail
          response="$(curl -sS -X POST \
            -H "Authorization: Bearer ${NETLIFY_AUTH_TOKEN}" \
            -w '\n%{http_code}' \
            "https://api.netlify.com/api/v1/sites/${NETLIFY_SITE_ID}/ssl/renew")"
          code="${response##*$'\n'}"
          body="${response%$'\n'*}"
          printf '%s\n' "$body" | jq '{state,domains,updated_at,expires_at,message,error}'
          test "$code" -ge 200 -a "$code" -lt 300
