name: Deploy Frontend to Netlify

on:
  push:
    branches: ["server"]
    paths:
      - "frontend/**"
      - "scheduler/**"
      - "wlc/**"
      - "netlify.toml"
      - ".github/workflows/deploy-netlify.yml"
  workflow_dispatch: {}

concurrency:
  group: deploy-netlify
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend deps
        run: npm --prefix frontend ci

      - name: Install scheduler deps
        run: npm --prefix scheduler ci

      - name: Build frontend (injects VITE_* build vars)
        run: npm --prefix frontend run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}
          VITE_CAPTCHA_URL: ${{ secrets.VITE_CAPTCHA_URL }}
          VITE_WALINE_SERVER_URL: ${{ secrets.VITE_WALINE_SERVER_URL }}
          VITE_CREDIT_API_BASE: ${{ secrets.VITE_CREDIT_API_BASE }}

      - name: Deploy to Netlify (production)
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: npx netlify-cli deploy --prod --dir frontend/dist --site jcourse-web
