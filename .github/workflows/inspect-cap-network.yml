name: Inspect Cap Docker Network

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect VPS Cap/backend network
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -eu
            printf '%s\n' 'container metadata'
            docker inspect cap --format 'cap image={{.Config.Image}} compose={{index .Config.Labels "com.docker.compose.project"}}/{{index .Config.Labels "com.docker.compose.service"}} networks={{range $name, $conf := .NetworkSettings.Networks}}{{$name}} {{end}} exposed={{range $port, $conf := .Config.ExposedPorts}}{{$port}} {{end}}'
            docker inspect yourtjcourse-backend-1 --format 'backend image={{.Config.Image}} compose={{index .Config.Labels "com.docker.compose.project"}}/{{index .Config.Labels "com.docker.compose.service"}} networks={{range $name, $conf := .NetworkSettings.Networks}}{{$name}} {{end}}'
            printf '%s\n' 'relevant network members'
            for network_name in $(docker network ls --format '{{.Name}}'); do
              members=$(docker network inspect "$network_name" --format '{{range $id, $container := .Containers}}{{$container.Name}} {{end}}' 2>/dev/null || true)
              case " $members " in
                *' cap '*|*' yourtjcourse-backend-1 '*) printf '%s\t%s\n' "$network_name" "$members" ;;
              esac
            done
            printf 'backend_resolves_cap='
            if docker exec yourtjcourse-backend-1 getent hosts cap >/dev/null 2>&1; then printf 'yes\n'; else printf 'no\n'; fi
            printf 'backend_reaches_cap_http='
            docker exec yourtjcourse-backend-1 node -e 'fetch("http://cap:3000/").then((res) => { console.log(res.status); process.exit(0) }).catch(() => process.exit(1))' >/tmp/cap-http-status 2>/dev/null && printf 'yes status=%s\n' "$(cat /tmp/cap-http-status)" || printf 'no\n'
