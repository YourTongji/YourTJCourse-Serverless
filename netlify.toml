[build]
  # 该分支的前端已收敛为纯前端重定向页，构建只依赖 frontend 自身
  command = "npm --prefix frontend ci && npm --prefix frontend run build"
  publish = "frontend/dist"

[build.environment]
  NODE_VERSION = "22"

[[edge_functions]]
  path = "/api/settings/runtime-state"
  function = "legacy-app-notice"

[[edge_functions]]
  path = "/api/settings/announcements"
  function = "legacy-app-notice"

# 任意路径都渲染这张公告页，再由页面本身跳转到 f.yourtj.de
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
